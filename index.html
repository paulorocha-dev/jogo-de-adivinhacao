<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo de Adivinhação</title>
    <script src="jogo.js"></script>
    <link rel="stylesheet" href="estilos.css">

</head>
<body>
    <h1>Jogo de Adivinhação</h1>

    <h2>Instruções:</h2>
    <ul>
        <li>Digite um número entre 1 e 100.</li>
        <li>Clique no botão "Chutar" para enviar seu palpite.</li>
        <li>Se errar, tente novamente até acertar ou esgotar suas tentativas!</li>
    </ul>
    
    <h2>Seu palpite:</h2>
    <input type="number" id="palpite" min="1" max="100" placeholder="Digite seu palpite aqui">
    <button id="chutar" onclick="chutar()">Chutar</button>
    <p id="resultado"></p>
    <p id="dica"></p>
    <p id="tentativas"></p>
    <p id="reiniciar"><button id="reiniciarBtn" onclick="reiniciarJogo()">Reiniciar Jogo</button></p>

</body>
</html>
